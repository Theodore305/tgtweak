name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install ldid
      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
      - name: Build
        run: make FINALPACKAGE=1
      - name: Collect dylib
        run: |
          mkdir out
          cp "$(find .theos/obj -name TelegramCallTweak.dylib | head -n 1)" out/
          install_name_tool -id @rpath/TelegramCallTweak.dylib out/TelegramCallTweak.dylib
          ldid -S out/TelegramCallTweak.dylib
          otool -L out/TelegramCallTweak.dylib
          file out/TelegramCallTweak.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: TelegramCallTweak
          path: out/TelegramCallTweak.dylib
